name: Test Build

on:
  push:
    branches:
      - tune_for_jethub
  pull_request:
    branches:
      - tune_for_jethub
  workflow_dispatch:

jobs:
  get-kernel-versions:
    runs-on: [self-hosted, ubuntu-latest]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Fetch kernel versions from kernel.org
        id: set-matrix
        run: |
          # Fetch releases.json and extract all kernel versions >= 6.x
          curl -s https://www.kernel.org/releases.json > /tmp/releases.json
          
          # Parse JSON and extract versions
          versions=$(python3 << 'EOF'
          import json, re

          with open('/tmp/releases.json', 'r') as f:
              data = json.load(f)

          releases = [r for r in data.get('releases', []) if r.get('version')]

          # linux-next versions look like "next-YYYYMMDD": the git tag is the
          # version verbatim (no "v" prefix) and lives in the linux-next tree.
          # Numbered releases (6.12.93, 7.2, 7.3-rc1, ...) use a "v" prefix.
          def tag(version):
              return version if version.startswith('next-') else 'v' + version

          def vkey(version):
              return [int(x) for x in re.split(r'[.-]', version) if x.isdigit()]

          # Tiered matrix. The newest longterm, the newest stable and linux-next
          # build the full toolchain/arch square; every other maintained line
          # (older LTS, mainline rc) keeps the single gcc/x86_64 cell it builds
          # today — its job is catching kernel API breakage, and one toolchain
          # covers that.
          FULL = [('gcc', 'x86_64'), ('gcc', 'arm64'),
                  ('llvm', 'x86_64'), ('llvm', 'arm64')]
          SHORT = [('gcc', 'x86_64')]

          # Each cell builds natively on a runner of its target arch.
          RUNNER = {'x86_64': ['self-hosted', 'ubuntu-latest'],
                    'arm64': ['self-hosted', 'ubuntu-latest-arm']}

          full_versions = set()
          for moniker in ('stable', 'longterm'):
              lines = [r['version'] for r in releases if r.get('moniker') == moniker]
              if lines:
                  full_versions.add(max(lines, key=vkey))
          full_versions.update(
              r['version'] for r in releases if r.get('moniker') == 'linux-next')
          # A freshly released mainline (no -rc suffix) IS the newest release for
          # the window before its first stable point release spins up the
          # 'stable' moniker; give it the full square too. Once mainline moves
          # on to the next -rc it drops back to the short tier automatically.
          full_versions.update(
              r['version'] for r in releases
              if r.get('moniker') == 'mainline' and '-rc' not in r['version'])

          include = []
          for r in releases:
              combos = FULL if r['version'] in full_versions else SHORT
              for tc, arch in combos:
                  include.append({'kernel_version': tag(r['version']),
                                  'toolchain': tc, 'arch': arch,
                                  'runner': RUNNER[arch]})

          print(json.dumps({'include': include}))
          EOF
          )
          
          echo "matrix=$versions" >> $GITHUB_OUTPUT
          echo "Kernel versions to build: $versions"

  build:
    needs: get-kernel-versions
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.get-kernel-versions.outputs.matrix) }}
      fail-fast: false

    env:
      # Builds are native: the runner's arch matches the cell's (see RUNNER in
      # the matrix step). ARCH is still set explicitly — the driver's Makefile
      # otherwise derives it from 'uname -m', which yields "aarch64" where
      # kbuild expects "arm64". TC is splatted into every make call ('' for gcc).
      ARCH: ${{ matrix.arch }}
      TC: ${{ matrix.toolchain == 'llvm' && 'LLVM=1' || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            kmod \
            cpio \
            dwarves \
            git \
            file \
            clang \
            lld \
            llvm
      
      - name: Setup kernel source
        run: |
          echo "Setting up kernel source for ${{ matrix.kernel_version }} / ${{ matrix.toolchain }}/${{ matrix.arch }}"
          TAG="${{ matrix.kernel_version }}"
          # One tree per toolchain/arch combo: the .config differs (CC_IS_CLANG,
          # target arch), and sharing a tree would force a full reconfigure and
          # rebuild every time the combos alternate on a cached runner. The
          # gcc/x86_64 tree keeps the historical unsuffixed path (warm cache).
          DEST="/tmp/linux-$TAG"
          if [ "${{ matrix.toolchain }}-${{ matrix.arch }}" != "gcc-x86_64" ]; then
            DEST="$DEST-${{ matrix.toolchain }}-${{ matrix.arch }}"
          fi
          echo "KTREE=$DEST" >> "$GITHUB_ENV"
          # Clone the Linux kernel at the given tag. linux-next tags (next-YYYYMMDD)
          # live in the linux-next tree; everything else is a stable/mainline tag.
          if [ ! -d "$DEST" ]; then
            case "$TAG" in
              next-*)
                git clone --depth 1 --branch "$TAG" https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git "$DEST"
                ;;
              *)
                git clone --depth 1 --branch "$TAG" https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git "$DEST" || \
                git clone --depth 1 --branch "$TAG" https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git "$DEST"
                ;;
            esac
          fi
          
      - name: Prepare kernel build environment
        run: |
          cd "$KTREE"
          # Use the arch default config, NOT the runner's distro /boot/config.
          make $TC defconfig
          # Enable the kernel options the rtl8822cs module needs so the out-of-tree
          # build sees complete headers (mirrors Buildroot rtl8822cs.mk CONFIG fixups).
          scripts/config --enable NET
          scripts/config --enable WIRELESS
          scripts/config --enable CFG80211
          scripts/config --enable MAC80211
          scripts/config --enable MMC
          # The arm64 defconfig carries RFKILL=m; in Kconfig tristate arithmetic
          # CFG80211's dependency "RFKILL || !RFKILL" then evaluates to m, which
          # caps CFG80211/MAC80211 back to =m on olddefconfig — and =m exports
          # never reach vmlinux.symvers, so modpost fails the module link with
          # "cfg80211_* undefined". Force it built-in.
          scripts/config --enable RFKILL
          # Disable certificate-related options that require distro-specific files
          scripts/config --disable SYSTEM_TRUSTED_KEYS
          scripts/config --disable SYSTEM_REVOCATION_KEYS
          scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str SYSTEM_REVOCATION_KEYS ""
          # -Werror gate, set explicitly so it does not depend on which arch
          # defconfig happens to carry CONFIG_WERROR (x86_64 does, arm64 does
          # not). gcc cells gate on the driver's warnings — the same condition
          # the Buildroot x86 autobuilder hits — and their classes are at zero.
          # llvm cells stay informational until the clang-only classes reach
          # zero too (counted in the summary; only the kernel's default-fatal
          # diagnostics fail the build) — then enable WERROR here as well.
          if [ "${{ matrix.toolchain }}" = "gcc" ]; then
            scripts/config --enable WERROR
          else
            scripts/config --disable WERROR
          fi
          # Reconcile and prepare for external module builds
          make $TC olddefconfig
          # modules_prepare sets up the external-module scaffolding (modpost, modfinal
          # rules); without it the out-of-tree build dies at __modfinal ("No rule to
          # make target '88x2cs.ko'"). vmlinux is then a PARTIAL build (no loadable =m
          # modules, no bzImage; ~5 min vs ~10 for a full make) that emits
          # vmlinux.symvers with every exported symbol. A complete Module.symvers is
          # only written by 'make modules', which we don't need — the driver's deps are
          # all =y, so vmlinux.symvers is complete for it. Copy it to Module.symvers so
          # a leftover "undefined symbol" means a REAL link break, not a missing symvers.
          make $TC modules_prepare
          make -j"$(nproc)" $TC vmlinux
          cp vmlinux.symvers Module.symvers
          
      - name: Build module
        run: |
          echo "Building rtl88x2cs module for kernel ${{ matrix.kernel_version }} / ${{ matrix.toolchain }}/${{ matrix.arch }}"
          LOG="/tmp/build-${{ matrix.kernel_version }}-${{ matrix.toolchain }}-${{ matrix.arch }}.log"
          # We do NOT force -Werror: our own warnings (missing-prototypes, unused-
          #   function, ...) are informational and only counted in the summary below.
          #   The build still fails on the kernel's own default-fatal diagnostics
          #   (-Werror=implicit-function-declaration / =incompatible-pointer-types /
          #   =return-type / ...), i.e. real API breakage like on linux-next.
          # -k (keep-going): compile every file even after an error, so the by-type
          #   tally below is COMPLETE (without it the build stops at the first file).
          # No KBUILD_MODPOST_WARN: with Module.symvers in place (see Prepare) modpost
          #   resolves the real exports, so a remaining "undefined symbol" is a genuine
          #   link break (removed/renamed kernel API) and MUST fail the build.
          set -o pipefail
          rc=0
          make -k $TC KSRC="$KTREE" \
               2>&1 | tee "$LOG" || rc=$?

          # Count diagnostics by type (gcc prints the class in brackets, e.g.
          # [-Werror=missing-prototypes]). Pure shell, no extra tooling.
          # NOTE: trailing '|| true' — a CLEAN build has zero [-W...] matches, so grep
          # exits 1; under 'set -e -o pipefail' that would fail an otherwise green
          # build. '|| true' on the whole pipeline keeps clean == green. (It must be on
          # the pipeline tail: '{ grep || true; } | ...' does NOT work — pipefail still
          # surfaces grep's 1 from inside the group.)
          echo "### ${{ matrix.kernel_version }} / ${{ matrix.toolchain }}/${{ matrix.arch }} — diagnostics by type" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hoE '\[-W[A-Za-z0-9=_+-]+\]' "$LOG" \
            | sed -E 's/^\[-W(error=)?//; s/\]$//' \
            | sort | uniq -c | sort -rn \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          # Link/compile counts that the [-W...] tally above misses. objtool warnings
          # (e.g. a missing __noreturn) are fatal under CONFIG_OBJTOOL_WERROR; modpost
          # "undefined" now means a real unresolved kernel symbol; both also fail the
          # build via rc — these lines just surface them in the summary.
          total=$(grep -c ': error:' "$LOG" || true)
          objt=$(grep -c 'warning: objtool:' "$LOG" || true)
          undef=$(grep -cE 'modpost:.*\bundefined\b' "$LOG" || true)
          ld=$(grep -cE 'undefined reference to|: ld(\.[a-z]+)?: ' "$LOG" || true)
          {
            echo "error: lines (compile):    ${total:-0}"
            echo "objtool warnings:          ${objt:-0}"
            echo "modpost undefined symbols: ${undef:-0}"
            echo "linker errors:             ${ld:-0}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit $rc
      
      - name: Check build artifacts
        run: |
          # Check if object files were compiled successfully
          if find . -name "*.o" -path "*/hal/*" -o -name "*.o" -path "*/core/*" -o -name "*.o" -path "*/os_dep/*" | grep -q .; then
            echo "Module compiled successfully for kernel ${{ matrix.kernel_version }}"
            echo "Object files created:"
            find . -name "*.o" | head -20
            # Check if .ko file exists (may have warnings but still built)
            if [ -f 88x2cs.ko ]; then
              echo "Module 88x2cs.ko was also linked (possibly with warnings):"
              ls -lh 88x2cs.ko
              file 88x2cs.ko
            fi
          else
            echo "Module compilation failed - no object files found"
            exit 1
          fi

