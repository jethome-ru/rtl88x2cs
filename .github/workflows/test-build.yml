name: Test Build

on:
  push:
    branches:
      - tune_for_jethub
  pull_request:
    branches:
      - tune_for_jethub
  workflow_dispatch:

jobs:
  get-kernel-versions:
    runs-on: [self-hosted, X64]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Fetch kernel versions from kernel.org
        id: set-matrix
        run: |
          # Fetch releases.json and extract all kernel versions >= 6.x
          curl -s https://www.kernel.org/releases.json > /tmp/releases.json
          
          # Parse JSON and extract versions
          versions=$(python3 << 'EOF'
          import json
          
          with open('/tmp/releases.json', 'r') as f:
              data = json.load(f)
          
          versions = []
          for release in data.get('releases', []):
              version = release.get('version', '')
              if not version:
                  continue
              # linux-next versions look like "next-YYYYMMDD": the git tag is the
              # version verbatim (no "v" prefix) and lives in the linux-next tree.
              # Numbered releases (6.12.93, 7.1, 7.2-rc1, ...) use a "v" prefix.
              if version.startswith('next-'):
                  tag = version
              else:
                  tag = 'v' + version
              versions.append(tag)
          
          # Create matrix JSON
          matrix = {'kernel_version': versions}
          print(json.dumps(matrix))
          EOF
          )
          
          echo "matrix=$versions" >> $GITHUB_OUTPUT
          echo "Kernel versions to build: $versions"

  build:
    needs: get-kernel-versions
    runs-on: [self-hosted, X64]
    strategy:
      matrix: ${{ fromJson(needs.get-kernel-versions.outputs.matrix) }}
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            bc \
            kmod \
            cpio \
            dwarves \
            git \
            file
      
      - name: Setup kernel source
        run: |
          echo "Setting up kernel source for version ${{ matrix.kernel_version }}"
          TAG="${{ matrix.kernel_version }}"
          DEST="/tmp/linux-$TAG"
          # Clone the Linux kernel at the given tag. linux-next tags (next-YYYYMMDD)
          # live in the linux-next tree; everything else is a stable/mainline tag.
          if [ ! -d "$DEST" ]; then
            case "$TAG" in
              next-*)
                git clone --depth 1 --branch "$TAG" https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git "$DEST"
                ;;
              *)
                git clone --depth 1 --branch "$TAG" https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git "$DEST" || \
                git clone --depth 1 --branch "$TAG" https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git "$DEST"
                ;;
            esac
          fi
          
      - name: Prepare kernel build environment
        run: |
          cd /tmp/linux-${{ matrix.kernel_version }}
          # Use the arch default config (x86_64_defconfig on the x64 runner), NOT the
          # runner's distro /boot/config. The arch defconfig sets CONFIG_WERROR=y — the
          # same condition the Buildroot x86 autobuilder hits — so the module build
          # inherits a real -Werror and the CI actually gates on the driver's warnings.
          make defconfig
          # Enable the kernel options the rtl8822cs module needs so the out-of-tree
          # build sees complete headers (mirrors Buildroot rtl8822cs.mk CONFIG fixups).
          scripts/config --enable NET
          scripts/config --enable WIRELESS
          scripts/config --enable CFG80211
          scripts/config --enable MAC80211
          scripts/config --enable MMC
          # Disable certificate-related options that require distro-specific files
          scripts/config --disable SYSTEM_TRUSTED_KEYS
          scripts/config --disable SYSTEM_REVOCATION_KEYS
          scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          scripts/config --set-str SYSTEM_REVOCATION_KEYS ""
          # Reconcile and prepare for external module builds
          make olddefconfig
          # modules_prepare sets up the external-module scaffolding (modpost, modfinal
          # rules); without it the out-of-tree build dies at __modfinal ("No rule to
          # make target '88x2cs.ko'"). vmlinux is then a PARTIAL build (no loadable =m
          # modules, no bzImage; ~5 min vs ~10 for a full make) that emits
          # vmlinux.symvers with every exported symbol. A complete Module.symvers is
          # only written by 'make modules', which we don't need — the driver's deps are
          # all =y, so vmlinux.symvers is complete for it. Copy it to Module.symvers so
          # a leftover "undefined symbol" means a REAL link break, not a missing symvers.
          make modules_prepare
          make -j"$(nproc)" vmlinux
          cp vmlinux.symvers Module.symvers
          
      - name: Build module
        run: |
          echo "Building rtl88x2cs module for kernel ${{ matrix.kernel_version }}"
          LOG="/tmp/build-${{ matrix.kernel_version }}.log"
          # We do NOT force -Werror: our own warnings (missing-prototypes, unused-
          #   function, ...) are informational and only counted in the summary below.
          #   The build still fails on the kernel's own default-fatal diagnostics
          #   (-Werror=implicit-function-declaration / =incompatible-pointer-types /
          #   =return-type / ...), i.e. real API breakage like on linux-next.
          # -k (keep-going): compile every file even after an error, so the by-type
          #   tally below is COMPLETE (without it the build stops at the first file).
          # No KBUILD_MODPOST_WARN: with Module.symvers in place (see Prepare) modpost
          #   resolves the real exports, so a remaining "undefined symbol" is a genuine
          #   link break (removed/renamed kernel API) and MUST fail the build.
          set -o pipefail
          rc=0
          make -k KSRC=/tmp/linux-${{ matrix.kernel_version }} \
               2>&1 | tee "$LOG" || rc=$?

          # Count diagnostics by type (gcc prints the class in brackets, e.g.
          # [-Werror=missing-prototypes]). Pure shell, no extra tooling.
          # NOTE: trailing '|| true' — a CLEAN build has zero [-W...] matches, so grep
          # exits 1; under 'set -e -o pipefail' that would fail an otherwise green
          # build. '|| true' on the whole pipeline keeps clean == green. (It must be on
          # the pipeline tail: '{ grep || true; } | ...' does NOT work — pipefail still
          # surfaces grep's 1 from inside the group.)
          echo "### ${{ matrix.kernel_version }} — diagnostics by type" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hoE '\[-W[A-Za-z0-9=_+-]+\]' "$LOG" \
            | sed -E 's/^\[-W(error=)?//; s/\]$//' \
            | sort | uniq -c | sort -rn \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          # Link/compile counts that the [-W...] tally above misses. objtool warnings
          # (e.g. a missing __noreturn) are fatal under CONFIG_OBJTOOL_WERROR; modpost
          # "undefined" now means a real unresolved kernel symbol; both also fail the
          # build via rc — these lines just surface them in the summary.
          total=$(grep -c ': error:' "$LOG" || true)
          objt=$(grep -c 'warning: objtool:' "$LOG" || true)
          undef=$(grep -cE 'modpost:.*\bundefined\b' "$LOG" || true)
          ld=$(grep -cE 'undefined reference to|: ld(\.[a-z]+)?: ' "$LOG" || true)
          {
            echo "error: lines (compile):    ${total:-0}"
            echo "objtool warnings:          ${objt:-0}"
            echo "modpost undefined symbols: ${undef:-0}"
            echo "linker errors:             ${ld:-0}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          exit $rc
        env:
          ARCH: x86_64
      
      - name: Check build artifacts
        run: |
          # Check if object files were compiled successfully
          if find . -name "*.o" -path "*/hal/*" -o -name "*.o" -path "*/core/*" -o -name "*.o" -path "*/os_dep/*" | grep -q .; then
            echo "Module compiled successfully for kernel ${{ matrix.kernel_version }}"
            echo "Object files created:"
            find . -name "*.o" | head -20
            # Check if .ko file exists (may have warnings but still built)
            if [ -f 88x2cs.ko ]; then
              echo "Module 88x2cs.ko was also linked (possibly with warnings):"
              ls -lh 88x2cs.ko
              file 88x2cs.ko
            fi
          else
            echo "Module compilation failed - no object files found"
            exit 1
          fi

